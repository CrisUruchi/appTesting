<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CRUD Productos</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
        h1 { color: #333; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 8px; }
        form { display: grid; gap: 10px; margin-bottom: 20px; }
        input, button { padding: 8px; font-size: 14px; }
        button { background: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; }
        button:hover { background: #0056b3; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #007bff; color: white; }
        .error { color: red; margin: 10px 0; }
        .acciones button { margin-right: 5px; padding: 4px 8px; font-size: 12px; }
        #form-producto label { font-weight: 600;
        }

        #form-producto input {
            padding: 6px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>CRUD de Productos</h1>

    <!--
    <form id="form-producto">
        <input type="hidden" id="id" />
        <input type="text" id="nombre" placeholder="Nombre" required maxlength="100" />
        <input type="text" id="descripcion" placeholder="Descripción" maxlength="255" />
        <input type="number" id="precio" placeholder="Precio" step="0.01" min="0.01" required />
        <input type="date" id="fecha_vencimiento" required />
        <button type="submit" id="btn-guardar">Crear</button>
        <button type="button" id="btn-cancelar" style="display:none;">Cancelar</button>
    </form>
    -->
    <form id="form-producto">
        <input type="hidden" id="id" />

        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" placeholder="Nombre" required maxlength="100" />

        <label for="descripcion">Descripción</label>
        <input type="text" id="descripcion" placeholder="Descripción" maxlength="255" />

        <label for="precio">Precio</label>
        <input type="number" id="precio" placeholder="Precio" step="0.01" min="0.01" required />

        <label for="fecha_vencimiento">Fecha de vencimiento</label>
        <input type="date" id="fecha_vencimiento" required />

        <button type="submit" id="btn-guardar">Crear</button>
        <button type="button" id="btn-cancelar" style="display:none;">Cancelar</button>
    </form>

    <div class="error" id="error"></div>

    <table>
        <thead>
            <tr>
                <th>ID</th><th>Nombre</th><th>Descripción</th><th>Precio</th><th>Vencimiento</th><th>Acciones</th>
            </tr>
        </thead>
        <tbody id="tbody-productos"></tbody>
    </table>
</div>

<script src="/static/app.js"></script>
</body>
</html>
